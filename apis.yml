aid: ticketrev
name: TicketRev
description: >-
  TicketRev (TICKR Holdings, Inc.) is a buyer-first ticketing platform for live sports and
  entertainment, founded in 2022. Its marketplace lets fans name their own price on tickets while
  giving teams and venues offer-based selling, flow purchasing, seat upgrades, and premium-inventory
  tools. Products span four solutions - Core (offer-based purchases), Breeze (flow purchasing),
  Upgrades (in-seat upgrades), and Premium (premium seating revenue) - and are used by MLB clubs
  including the Houston Astros, Miami Marlins, and Tampa Bay Rays. TicketRev is backed by Soma
  Capital, Groove Capital, 500 Global, and Techstars. The company publicly commits to SOC 2 Type II
  and PCI DSS security and compliance. No public developer API surface was found at the time of
  enrichment.
